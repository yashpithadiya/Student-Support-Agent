<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Student Support Agent</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<style>
:root{--bg:linear-gradient(135deg,#f7f9ff,#eef2ff 55%,#fff4ec);--side:#eef0fb;--card:#fff;--bd:#e4e8f5;--tx:#101a3d;--mu:#6f7a9b;--pr:#1f6bff;--act:#dfe8ff;--th:#f3f6fd;--sh:0 4px 18px rgba(40,60,120,.07);--sb:rgba(90,105,160,.3)}
[data-theme=dark]{color-scheme:dark;--bg:radial-gradient(circle at 70% 10%,#16204a,#0b0f1e 60%);--side:#11141f;--card:#121830;--bd:#222b4a;--tx:#eef1fb;--mu:#8d96b5;--act:#1c3470;--th:#172043;--sh:none;--sb:rgba(150,165,220,.3)}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--sb) transparent}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--sb);border-radius:8px}
html,body{height:100%;margin:0}body{font:14px/1.45 "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;color:var(--tx);background:var(--bg);overflow:hidden}button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.app{display:grid;grid-template-columns:clamp(170px,15vw,230px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh}
.side{background:var(--side);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto;min-height:0}.logo{width:42px;height:42px;border-radius:12px;background:var(--pr);display:grid;place-items:center;margin:0 0 18px 6px}
.nav{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:12px;text-align:left;width:100%}.nav.on{background:var(--act);color:var(--pr);font-weight:600}.nav:hover{background:var(--act)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.grow{flex:1}.tg{background:var(--card);box-shadow:var(--sh)}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;height:100%;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:14px clamp(14px,2.5vw,32px);gap:10px;flex:none}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:9px 16px;box-shadow:var(--sh);font-weight:600;border:0}.stage{flex:1;min-height:0;overflow:auto;padding:0 clamp(14px,2.5vw,32px) 24px}
h1{margin:4px 0 2px;font-size:clamp(28px,3.4vw,42px)}h1 b{color:var(--pr)}.sub{color:var(--mu);margin:0 0 16px}h2{font-size:17px;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:14px}.stat,.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh);min-width:0}
.stat{display:flex;gap:14px;align-items:center}.stat .ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;flex:none}.stat b{font-size:30px;display:block;line-height:1.1}.stat small{color:var(--mu)}
.b1{background:#e3ecff;color:#1f6bff}.b2{background:#dcf5ea;color:#12a06a}.b3{background:#ece4ff;color:#7a4dff}[data-theme=dark] .b1{background:#1b2c5c}[data-theme=dark] .b2{background:#12382f}[data-theme=dark] .b3{background:#2a2058}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:14px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.lnk{background:none;border:0;color:var(--pr);font-weight:600}.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--th);text-align:left;color:var(--mu);font-weight:600}td,th{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:middle;white-space:nowrap}td.w{white-space:normal;min-width:160px}
.bd{display:inline-block;border-radius:8px;padding:2px 10px;font-size:12px;font-weight:600}.pending,.medium{background:#fff1d6;color:#b86e00}.approved,.open,.success,.resolved,.closed,.allowed{background:#dcf5ea;color:#0f8a5a}.revoked{background:#eef1fb;color:#55608a}.rejected,.high,.urgent,.blocked{background:#fde3e3;color:#c2272d}.in-progress{background:#e3ecff;color:#1f6bff}.normal{background:#eef1fb;color:#55608a}
.btn{border:0;border-radius:8px;padding:4px 12px;font-weight:600;font-size:12px}.v{background:#e3ecff;color:#1f6bff}.ok{background:#dcf5ea;color:#0f8a5a}.no{background:#fde3e3;color:#c2272d}.btn:disabled{opacity:.5}
.menu{position:relative}.mpop{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:6px;z-index:30}.mpop[hidden]{display:none}
.mi{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 12px;border-radius:10px;text-decoration:none;color:inherit;text-align:left}.mi:hover,.mi:focus-visible{background:var(--act)}.hr{height:1px;background:var(--bd);margin:6px 4px}
.sw{margin-left:auto;width:42px;height:24px;border-radius:999px;background:#c9d1ea;position:relative;flex:none}.sw:after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}[data-theme=dark] .sw{background:var(--pr)}[data-theme=dark] .sw:after{left:21px}
.pill#pbtn{gap:10px;padding:8px 14px 8px 12px;max-width:min(100%,280px)}.pn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}svg.chev{width:18px;height:18px;overflow:visible}.av{width:36px;height:36px;border-radius:50%;background:#aebcff;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.srch{width:min(100%,360px);padding:9px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);margin-bottom:12px}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);padding:22px;width:min(560px,92vw)}dialog::backdrop{background:rgba(10,15,40,.45)}dialog textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:8px;background:var(--th)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:12px 0}.kv dt{color:var(--mu)}.kv dd{margin:0;overflow-wrap:anywhere}
.set{max-width:760px}.sh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:20px 0 4px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--bd)}.row span:first-child{color:var(--mu)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--card);padding:10px 18px;border-radius:12px;z-index:50}.err{color:#c2272d}
@media(max-width:700px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{flex-direction:row;overflow-x:auto;padding:8px}.nav span,.logo{display:none}.pn{display:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="s-ov" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="s-ap" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 14l2 2 4-4"/></symbol><symbol id="s-st" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-4 11-4 12 0M16 5a3.5 3.5 0 010 6.5M18 15c2 .6 3.2 2 3.5 5"/></symbol>
<symbol id="s-tk" viewBox="0 0 24 24"><path d="M5 14v-2a7 7 0 0114 0v2"/><rect x="3" y="14" width="4" height="6" rx="2"/><rect x="17" y="14" width="4" height="6" rx="2"/></symbol><symbol id="s-po" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></symbol>
<symbol id="s-tr" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol><symbol id="s-au" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
<symbol id="s-cap" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 3 9 3 12 0v-5"/></symbol><symbol id="s-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></symbol>
<symbol id="s-us" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></symbol><symbol id="s-se" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol><symbol id="s-out" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></symbol></defs></svg>
<div class="app"><nav class="side" aria-label="Admin"><div class="logo"><svg class="i" style="stroke:#fff"><use href="#s-cap"/></svg></div>
<button class="nav" data-go="overview"><svg class="i"><use href="#s-ov"/></svg><span>Overview</span></button><button class="nav" data-go="approvals"><svg class="i"><use href="#s-ap"/></svg><span>Approval Requests</span></button>
<button class="nav" data-go="students"><svg class="i"><use href="#s-st"/></svg><span>Student Records</span></button><button class="nav" data-go="tickets"><svg class="i"><use href="#s-tk"/></svg><span>Support Tickets</span></button>
<button class="nav" data-go="policies"><svg class="i"><use href="#s-po"/></svg><span>Policies</span></button><button class="nav" data-go="traces"><svg class="i"><use href="#s-tr"/></svg><span>Agent Traces</span></button>
<button class="nav" data-go="audit"><svg class="i"><use href="#s-au"/></svg><span>Audit Log</span></button><div class="grow"></div>
<button class="nav tg" id="tg"><svg class="i"><use href="#s-sun"/></svg><span id="tl">Light Mode</span></button></nav>
<div class="main"><header class="top"><div class="pill"><svg class="i" style="color:var(--pr)"><use href="#s-cap"/></svg>Student Support Agent · Administrator</div>
<div class="menu" id="menu"><button class="pill" id="pbtn" aria-haspopup="menu" aria-expanded="false"><span class="av">{{ name.split()[0][0]|upper }}{{ name.split()[-1][0]|upper }}</span><span class="pn">{{ name }}</span><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
<div class="mpop" id="mpop" role="menu" hidden><button class="mi" role="menuitem" data-go="profile"><svg class="i"><use href="#s-us"/></svg>Profile</button><button class="mi" role="menuitem" data-go="settings"><svg class="i"><use href="#s-se"/></svg>Settings</button><div class="hr"></div>
<a class="mi" role="menuitem" href="/logout"><svg class="i"><use href="#s-out"/></svg>Sign Out</a></div></div></header>
<section class="stage" id="stage" aria-live="polite"></section></div></div>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ME={name:{{ name|tojson }},email:{{ email|tojson }},id:{{ login_id|tojson }}};
const api=async(u,o)=>{const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j};
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const fd=t=>t?new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const bd=s=>`<span class="bd ${esc(String(s).toLowerCase().replace(/\s+/g,'-'))}">${esc(String(s).replace(/^./,c=>c.toUpperCase()))}</span>`;
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')||`<tr><td colspan="${h.length}">Nothing to show yet.</td></tr>`}</table></div>`;
const tip=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)};
const aprAct=r=>`<button class="btn v" data-view="${r.id}">View</button> `+(r.status=='pending'?`<button class="btn ok" data-dec="approve" data-id="${r.id}">Approve</button> <button class="btn no" data-dec="reject" data-id="${r.id}">Reject</button>`:'');
const aprRow=(r,full)=>`<tr><td>${esc(r.request_id)}</td><td>${esc(r.student_id)}</td><td>${esc(r.student_name)}</td><td>${esc(r.type_label)}</td><td>${fd(r.requested_at).split(',')[0]}</td><td>${bd(r.status)}</td><td>${aprAct(r)}</td></tr>`;
const AH=['Request ID','Student ID','Student Name','Request Type','Submitted On','Status','Actions'];
const auRow=e=>`<tr><td>${fd(e.ts)}</td><td>${esc(e.actor)}</td><td>${esc(e.role)}</td><td>${esc(e.action)}</td><td>${esc(e.target)}</td><td>${bd(e.decision)}</td><td class="w">${esc(e.result)}</td></tr>`;
const V={
async overview(){const o=await api('/api/admin/overview'),a=o.agent;
 return `<h1><b>Admin</b> Overview</h1><p class="sub">Manage student support, approvals, and institutional policies.</p>
 <div class="stats"><div class="stat"><span class="ic b1"><svg class="i" style="width:30px;height:30px"><use href="#s-ap"/></svg></span><div><b>${o.pending}</b><strong>Pending Approvals</strong><br><small>Awaiting your review</small></div></div>
 <div class="stat"><span class="ic b2"><svg class="i" style="width:30px;height:30px"><use href="#s-tk"/></svg></span><div><b>${o.open_tickets}</b><strong>Open Support Tickets</strong><br><small>Open or in progress</small></div></div>
 <div class="stat"><span class="ic b3"><svg class="i" style="width:30px;height:30px"><use href="#s-st"/></svg></span><div><b>${o.students}</b><strong>Registered Students</strong><br><small>In the student records</small></div></div></div>
 <p class="sub">Agent runs: <b>${a.runs}</b> · Avg latency: <b>${a.avg_latency_ms==null?'Unavailable':a.avg_latency_ms+' ms'}</b> · Total tokens: <b>${a.total_tokens==null?'Unavailable':a.total_tokens}</b></p>
 <div class="grid2"><div class="card"><div class="ch"><h2>Pending Approval Requests</h2><button class="lnk" data-go="approvals">View all</button></div>${tbl(AH,o.pending_requests.map(aprRow))}</div>
 <div class="card"><div class="ch"><h2>Recent Support Tickets</h2><button class="lnk" data-go="tickets">View all</button></div>${tbl(['Ticket ID','Category','Priority','Status'],o.recent_tickets.map(t=>`<tr><td>${esc(t.ticket_id)}</td><td>${esc(t.category)}</td><td>${bd(t.priority)}</td><td>${bd(t.status)}</td></tr>`))}</div></div>
 <div class="card"><div class="ch"><h2>Recent Audit Activity</h2><button class="lnk" data-go="audit">View all</button></div>${tbl(['Timestamp','Actor','Role','Action','Target','Decision','Result'],o.recent_audit.map(auRow))}</div>`},
async approvals(){const r=await api('/api/admin/approvals');return `<h1><b>Approval</b> Requests</h1><p class="sub">Requests wait here. Nothing is applied until you approve.</p><div class="card">${tbl(AH,r.map(aprRow))}</div>`},
async students(q=''){const r=await api('/api/admin/students?q='+encodeURIComponent(q));return `<h1><b>Student</b> Records</h1><p class="sub">Search by ID, name or email.</p><input class="srch" id="q" placeholder="Search students…" value="${esc(q)}" aria-label="Search students"><div class="card">${tbl(['Student ID','Name','Email','Programme','Course','Sem','Fees','Scholarship','Details'],r.map(s=>`<tr><td>${esc(s.student_id)}</td><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${esc(s.programme)}</td><td>${esc(s.course)}</td><td>${esc(s.semester)}</td><td>${esc(s.fee_status)}</td><td>${esc(s.scholarship_status)}</td><td><button class="btn v" data-stu="${esc(s.student_id)}">View</button></td></tr>`))}</div>`},
async tickets(){const r=await api('/api/admin/tickets');return `<h1><b>Support</b> Tickets</h1><p class="sub">Choose a status, then press Update. The student sees the new status under Support → My Tickets.</p><div class="card">${tbl(['Ticket ID','Student','Category','Issue','Priority','Created','Status'],r.map(t=>`<tr><td>${esc(t.ticket_id)}</td><td>${esc(t.student_id)} ${esc(t.student_name)}</td><td>${esc(t.category)}</td><td class="w">${esc(t.description)}</td><td>${bd(t.priority)}</td><td>${fd(t.created_at)}</td><td>${t.status=='Revoked'?bd('Revoked')+' <small class="mu">withdrawn by student</small>':`<select data-tk="${esc(t.ticket_id)}" aria-label="Status for ${esc(t.ticket_id)}">${['Open','In Progress','Resolved','Closed'].map(s=>`<option ${s==t.status?'selected':''}>${s}</option>`).join('')}</select> <button class="btn v" data-upd="${esc(t.ticket_id)}">Update</button>`}</td></tr>`))}</div>`},
async policies(){const p=await api('/api/admin/policies');return `<h1><b>Policies</b></h1><p class="sub">${p.length} handbook sections · source: student_policy.md (sample handbook, not official rules)</p>`+p.map(c=>`<details class="card" style="margin-bottom:10px"><summary><b>${esc(c.title)}</b> <span class="bd normal">${esc(c.category)}</span></summary><p>${esc(c.text)}</p></details>`).join('')},
async traces(){const t=await api('/api/admin/traces');return `<h1><b>Agent</b> Traces</h1><p class="sub">Persisted agent runs (most recent first).</p>`+(t.map(x=>{const u=x.token_usage;return `<details class="card" style="margin-bottom:10px"><summary>${bd(x.errors.length?'error':'success')} <b>${esc(x.run_id)}</b> · ${esc(x.question.slice(0,70))} <span style="color:var(--mu)">· ${fd(x.start_time)} · ${x.latency_ms} ms · ${u.available?u.input_tokens+'/'+u.output_tokens+' tokens':'tokens unavailable'}</span></summary>
 ${tbl(['Step','Detail','Status'],x.events.map(e=>`<tr><td>${esc(e.type=='tool_call'?'Tool: '+e.tool:e.type=='model_call'?'Model call '+e.turn:'Error')}</td><td class="w">${esc(e.type=='tool_call'?JSON.stringify(e.arguments):e.type=='model_call'?(e.requested_tools.join(', ')||'final answer'):e.message)}</td><td>${e.type=='tool_call'?bd(e.status):''}</td></tr>`))}<p><b>Response:</b> ${esc(x.final_response)}</p><small>User: ${esc(x.user_id)} · Model: ${esc(x.model)} · Stopped: ${esc(x.stopping_reason)}</small></details>`}).join('')||'<div class="card">No traces yet.</div>')},
async audit(){const r=await api('/api/admin/audit');return `<h1><b>Audit</b> Log</h1><p class="sub">Authentication, authorization, approvals and ticket updates.</p><div class="card">${tbl(['Timestamp','Actor','Role','Action','Target','Decision','Result'],r.map(auRow))}</div>`},
async settings(){const h=await api('/api/health'),cur=document.documentElement.dataset.theme;return `<div class="set"><h1><b>Settings</b></h1><div class="sh">Appearance</div><div class="row"><span>Theme</span><button class="mi" style="width:auto" id="tg3">${cur=='dark'?'Dark':'Light'} mode<span class="sw" style="margin-left:12px"></span></button></div>
 <div class="sh">Account</div><div class="row"><span>Name</span><span>${esc(ME.name)}</span></div><div class="row"><span>Role</span><span>Administrator</span></div><div class="row"><span>Email</span><span>${esc(ME.email)}</span></div>
 <div class="sh">Application status</div><div class="row"><span>Backend</span><span class="${h.status=='ok'?'':'err'}">${h.status=='ok'?'● Online':'Unavailable'}</span></div><div class="row"><span>Model</span><span>${esc(h.model)}</span></div><div class="row"><span>Version</span><span>${esc(h.version)}</span></div></div>`},
async profile(){return `<div class="set"><h1><b>Profile</b></h1><div class="row"><span>Name</span><span>${esc(ME.name)}</span></div><div class="row"><span>Role</span><span>Administrator</span></div><div class="row"><span>Email</span><span>${esc(ME.email)}</span></div><div class="row"><span>Admin ID</span><span>${esc(ME.id)}</span></div></div>`}};
let cur='overview';
async function go(v,arg){cur=v;document.querySelectorAll('.nav[data-go]').forEach(n=>n.classList.toggle('on',n.dataset.go===v));history.replaceState(null,'','#'+v);const s=$('#stage');s.innerHTML='<p>Loading…</p>';
 try{s.innerHTML=await V[v](arg)}catch(e){s.innerHTML=`<div class="card err">Could not load this page: ${esc(e.message)} <button class="btn v" data-go="${v}">Retry</button></div>`}}
function theme(t){document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);const l=t=='dark'?'Dark Mode':'Light Mode';$('#tl').textContent=l}
function menu(open){$('#mpop').hidden=!open;$('#pbtn').setAttribute('aria-expanded',open)}
const dlg=h=>{const d=$('#dlg');d.innerHTML=h+'<form method="dialog" style="text-align:right;margin-top:14px"><button class="btn v">Close</button></form>';d.showModal()};
document.addEventListener('click',async e=>{if(!e.target.closest('#menu'))menu(false);const t=e.target.closest('button,a');if(!t)return;
 if(t.id==='pbtn'){menu($('#mpop').hidden);return}if(t.closest('#mpop'))menu(false);
 if(t.dataset.go){go(t.dataset.go)}
 if(t.id==='tg'||t.id==='tg3'){theme(document.documentElement.dataset.theme=='dark'?'light':'dark');if(cur==='settings')go('settings')}
 if(t.dataset.upd){const sel=document.querySelector(`[data-tk="${t.dataset.upd}"]`);t.disabled=true;try{await post('/api/admin/tickets/'+t.dataset.upd,{status:sel.value});tip('Ticket '+t.dataset.upd+' updated to '+sel.value);go('tickets')}catch(x){tip(x.message);t.disabled=false}return}
 if(t.dataset.view){try{const r=await api('/api/admin/approvals/'+t.dataset.view);dlg(`<h2>${esc(r.request_id)} · ${esc(r.type_label)}</h2><dl class="kv"><dt>Student</dt><dd>${esc(r.student_id)} ${esc(r.student_name)}</dd><dt>Current value</dt><dd>${esc(r.current_value)}</dd><dt>Requested value</dt><dd>${esc(r.new_value)}</dd><dt>Submitted</dt><dd>${fd(r.requested_at)}</dd><dt>Status</dt><dd>${bd(r.status)}</dd><dt>Decided by</dt><dd>${esc(r.decided_by||'—')} ${r.decided_at?'· '+fd(r.decided_at):''}</dd><dt>Reason</dt><dd>${esc(r.decision_reason||'—')}</dd></dl>`)}catch(x){tip(x.message)}}
 if(t.dataset.stu){try{const r=await api('/api/admin/students/'+t.dataset.stu);dlg(`<h2>${esc(r.name)}</h2><dl class="kv">${Object.entries(r).map(([k,v])=>`<dt>${esc(k.replace(/_/g,' '))}</dt><dd>${esc(v||'—')}</dd>`).join('')}</dl>`)}catch(x){tip(x.message)}}
 if(t.dataset.dec){const id=t.dataset.id,ap=t.dataset.dec=='approve';const d=$('#dlg');d.innerHTML=`<h2>${ap?'Approve':'Reject'} request</h2><p>${ap?'The requested change will be applied to the student record.':'The student record will stay unchanged. A reason is required.'}</p><textarea id="rs" rows="3" placeholder="${ap?'Optional note':'Reason for rejection'}" aria-label="Reason"></textarea><p class="err" id="de"></p><div style="text-align:right"><button class="btn v" id="dc">Cancel</button> <button class="btn ${ap?'ok':'no'}" id="dok">${ap?'Approve':'Reject'}</button></div>`;d.showModal();
  $('#dc').onclick=()=>d.close();$('#dok').onclick=async()=>{const b=$('#dok');b.disabled=true;try{await post('/api/admin/approvals/'+id,{decision:ap?'approve':'reject',reason:$('#rs').value});d.close();tip('Request '+(ap?'approved':'rejected'));go(cur)}catch(x){$('#de').textContent=x.message;b.disabled=false}}}});
let qt;document.addEventListener('input',e=>{if(e.target.id!=='q')return;clearTimeout(qt);const v=e.target.value;qt=setTimeout(async()=>{const s=$('#stage');s.innerHTML=await V.students(v).catch(x=>esc(x.message));$('#q').focus();const q=$('#q');q.setSelectionRange(v.length,v.length)},250)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#mpop').hidden){menu(false);$('#pbtn').focus()}});
theme(document.documentElement.dataset.theme);go(location.hash.slice(1) in V?location.hash.slice(1):'overview');
</script></body></html>
